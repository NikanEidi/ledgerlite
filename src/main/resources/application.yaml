spring:
  application:
    name: ledgerlite
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/ledgerlite
    username: ledgerlite
    password: ${DB_PASSWORD:ledgerlite}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
security:
   jwt:
      secret-key: ${JWT_SECRET_KEY:this-is-a-local-dev-secret-key-not-for-production-use-only-32bytes}
