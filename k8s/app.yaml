apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerlite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledgerlite
  template:
    metadata:
      labels:
        app: ledgerlite
    spec:
      containers:
        - name: ledgerlite
          image: ledgerlite:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledgerlite-config
            - secretRef:
                name: ledgerlite-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerlite-service
spec:
  type: NodePort
  selector:
    app: ledgerlite
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30088
